K: [384, 256, 128, 64, 32, 16]
p_redundancy_levels: [0.2, 0.6, 0.9]
eval_worlds_per_level: 4
policy_tune_worlds: 4
stratified_queries_per_type: 300
frontier_targets: [0.8, 0.9, 0.95]
tuning:
  tau_candidates: [0.7, 0.9]
  decay_rate_candidates: [0.005, 0.02]
  c_candidates: [1, 5]
  decay_rules: [time, recency_of_use, use_count, expected_utility]
  # Match the eval stratification cap; policy worlds with scarce types use
  # the same smaller count for every type to preserve the balanced mix.
  queries_per_type: 300
  utility_weight_profiles:
    - {core_relational: 1.0, causal_linked: 1.0, temporal: 1.0, social: 1.0, incidental: 1.0, interference: 1.0}
    - {core_relational: 1.0, causal_linked: 1.0, temporal: 1.0, social: 1.0, incidental: 0.5, interference: 0.5}
